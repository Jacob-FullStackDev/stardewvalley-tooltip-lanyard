<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stardew valley tooltip</title>
    <link href="index.css" rel="stylesheet" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="text-wrapper">
      <div class="text-container" id="date-text-container">
        <span id="day-of-week">Mon.</span>
        <span id="day">1</span>
      </div>
    </div>
    <div id="img-container">
      <img src="assets/imgs/weather/Sunny.png" id="weather" />
      <img src="assets/imgs/Center.png" id="center-img" />
      <img src="assets/imgs/seasons/Spring.png" id="season" />
    </div>
    <div class="text-wrapper">
      <div id="time-text-container" class="text-container">
        <span id="hours">6</span><span>:</span><span id="minutes">00</span>
        <span id="am-pm">am</span>
      </div>
    </div>
  </body>
</html>
